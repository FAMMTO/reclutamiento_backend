name: CI/CD — Backend Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, build y tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobbly_test
          POSTGRES_USER: jobbly
          POSTGRES_PASSWORD: jobbly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://jobbly:jobbly_test@localhost:5432/jobbly_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Tests de integración
        run: go test -v -count=1 -timeout 60s ./...

  deploy:
    name: Deploy al VPS (solo main)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: staging
      url: https://api.jobbly.mx

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compilar binarios para Linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o jobbly-api    ./cmd/api
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o jobbly-worker ./cmd/worker

      - name: Subir binarios al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "jobbly-api,jobbly-worker"
          target: /opt/jobbly/

      - name: Reiniciar servicios
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod +x /opt/jobbly/jobbly-api /opt/jobbly/jobbly-worker
            sudo systemctl restart jobbly-api jobbly-worker
            sudo systemctl is-active --quiet jobbly-api   && echo "API OK"    || (echo "jobbly-api no arrancó"    && exit 1)
            sudo systemctl is-active --quiet jobbly-worker && echo "Worker OK" || (echo "jobbly-worker no arrancó" && exit 1)
