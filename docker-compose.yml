# Entorno de desarrollo para el equipo (quien tenga Docker).
# En producción la API corre en el VPS apuntando a su Postgres vía DATABASE_URL.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobbly_dev
      POSTGRES_USER: jobbly
      POSTGRES_PASSWORD: jobbly_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbly -d jobbly_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "4000"
      APP_ENV: development
      DATABASE_URL: postgres://jobbly:jobbly_dev_password@postgres:5432/jobbly_dev?sslmode=disable
      JWT_SECRET: secreto-solo-para-desarrollo-local-de-48-chars!!
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_ADMIN_EMAIL: admin@jobbly.mx
      SEED_ADMIN_PASSWORD: CambiaEsto123
    ports:
      - "4000:4000"

volumes:
  pgdata:
